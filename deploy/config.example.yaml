# Biz.Bizadm.ClaudeTokenUsage.Server.Spa 설정 예시. <...>를 환경에 맞게 바꾼다.
# 최초 기동 시 OsKms.Salt가 기록되고, TLS를 쓰면 ServerCertificatePassword가 DEKENC: 암호문으로 바뀐다(파일이 다시 쓰여 주석이 사라진다).
ContentRootPath: <서버 배포 폴더 절대 경로>
Port: 4318
WebRootPath: ClientApp
DatabaseFilePath: data/token-usage.duckdb
OsKms:
  CredentialService: https://biz-bizadm-claudetokenusage.local
  CredentialAccount: claudetokenusage
  Iterations: <PBKDF2 반복 횟수>
  SecretsDekFilePath: secrets.dek
Tls:
  # true면 Port가 HTTPS(TLS 1.2·1.3, HTTP/1.1·2·3)로 열린다. HTTP와 함께 열 수 없다.
  UseTls: false
  # PKCS#12(.pfx/.p12) 파일. ContentRootPath 기준 상대 경로 또는 절대 경로. 서버 실행 계정이 읽을 수 있어야 한다.
  ServerCertificate: certs/server.pfx
  # PFX 암호 평문을 넣고 기동하면 DEKENC: 암호문으로 바뀌어 저장된다.
  ServerCertificatePassword: <PFX 암호>
  # (선택) PFX 안의 개인키 없는 중간 인증서를 보낼 순서대로, 인증서 이름(CN)을 쉼표로 구분해 적는다.
  CertificateChain:
  # (선택, Linux만) 허용할 TLS cipher suite 이름(TlsCipherSuite 열거형)을 쉼표로 구분해 적는다. 비우면 OS 기본값.
  IncludeCipherSuites:
